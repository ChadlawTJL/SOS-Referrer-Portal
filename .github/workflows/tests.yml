name: SOS Referrer Portal Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run automated tests
      - name: Run tests
        env:
          SECRET_KEY: github-actions-test-key
        run: |
          python -m pytest